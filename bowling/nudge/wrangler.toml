# The notification timer, as its own Worker.
#
# Pages Functions cannot be put on a timer, so this knocks on the site's
# POST /api/nudge every quarter hour. The site decides and sends; this holds
# only the token for that one door. The clock is a Durable Object alarm, not a
# cron trigger, because the account's five free cron triggers are taken.
#
#   npx wrangler deploy -c nudge/wrangler.toml
#   npx wrangler secret put NUDGE_TOKEN -c nudge/wrangler.toml
#   curl -X POST -H "X-Nudge-Token: <token>" https://bowling-nudge.<subdomain>.workers.dev/arm
#
# The same NUDGE_TOKEN must be set on the Pages project:
#   npx wrangler pages secret put NUDGE_TOKEN --project-name bowling-streak

name = "bowling-nudge"
main = "index.js"
compatibility_date = "2026-08-01"

# Reachable only for POST /arm with the token; everything else is a 404.
workers_dev = true
preview_urls = false

[[durable_objects.bindings]]
name = "TIMER"
class_name = "Timer"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Timer"]

[vars]
SITE_URL = "https://bowling-streak.pages.dev"

[observability]
enabled = true
