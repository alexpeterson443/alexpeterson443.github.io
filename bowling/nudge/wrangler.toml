# The evening nudge, as its own Worker.
#
# Pages Functions cannot be put on a timer, so the reminder lives here. It
# shares the site's KV namespace, which is the whole point: it reads the same
# scores and pauses the site does, and there is no second copy of the truth.
#
#   npx wrangler deploy -c nudge/wrangler.toml
#   npx wrangler secret put VAPID_PRIVATE_JWK -c nudge/wrangler.toml
#   npx wrangler secret put ACCESS_KEY        -c nudge/wrangler.toml
#
# The same VAPID_PRIVATE_JWK is not needed by the Pages site: the site only
# stores subscriptions, this Worker is what signs and sends.

name = "bowling-nudge"
main = "index.js"
compatibility_date = "2026-08-01"

# Not a public site. The fetch handler exists only as an authenticated dry run.
workers_dev = true

[[kv_namespaces]]
binding = "STREAK_KV"
id = "5a22857ff2534e83a8ea89871c179cd2"

[triggers]
# Every quarter hour. The window is two hours wide, so the first tick inside it
# is the one that sends; the rest cost a pure function call and return. Quarter
# hours also line up exactly with a 9:45 PM last call in a whole hour timezone.
crons = ["*/15 * * * *"]

[vars]
# These must agree with the Pages site, or the Worker will be reasoning about a
# different day than the app is showing. Alley hours default to the table in
# functions/_lib/hours.js; if HOURS is ever set on the site, set it here too.
TIMEZONE = "America/Chicago"
LAST_CALL_MINUTES = "15"
# Who a push service should contact about a misbehaving sender. Set it as a
# secret rather than committing an address:
#   npx wrangler secret put VAPID_SUBJECT -c nudge/wrangler.toml
