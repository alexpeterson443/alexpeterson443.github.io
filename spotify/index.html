<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="description" content="Your listening history and stats from Spotify and Apple Music, merged into one dataset — top artists and tracks, a full lifetime breakdown from your data exports, and a play log that keeps growing." />
  <meta name="theme-color" content="#121211" media="(prefers-color-scheme: dark)" />
  <meta name="theme-color" content="#f6f6f4" media="(prefers-color-scheme: light)" />
  <meta name="referrer" content="strict-origin-when-cross-origin" />
  <link rel="icon" href="icon.svg" type="image/svg+xml" />
  <link rel="icon" href="icon-192.png" sizes="192x192" type="image/png" />
  <link rel="apple-touch-icon" href="apple-touch-icon.png" />
  <link rel="manifest" href="manifest.webmanifest" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="Listening" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <title>Listening Stats · your Spotify and Apple Music numbers</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <a class="skip" href="#main">Skip to content</a>

  <header class="appbar">
    <div class="brand">
      <svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
        <path d="M4 18V9" /><path d="M9 18V4" /><path d="M14 18v-6" /><path d="M19 18v-10" />
      </svg>
      <span class="brand-name">Listening Stats</span>
    </div>
    <div class="bar-spacer"></div>
    <div class="who" id="who" hidden>
      <img id="whoArt" src="" alt="" width="30" height="30" hidden />
      <span class="who-name" id="whoName"></span>
    </div>
    <button class="btn btn-icon btn-ghost" id="themeBtn" type="button" title="Switch theme" aria-label="Switch theme">
      <svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
        <circle cx="12" cy="12" r="4" /><path d="M12 2v2M12 20v2M2 12h2M20 12h2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M19.1 4.9l-1.4 1.4M6.3 17.7l-1.4 1.4" />
      </svg>
    </button>
    <button class="btn btn-primary" id="connectBtn" type="button">Connect Spotify</button>
  </header>

  <nav class="tabs" id="tabs" role="tablist" aria-label="Sections"></nav>

  <main class="wrap" id="main">
    <div id="banners"></div>

    <section class="view" id="view-overview" role="tabpanel" aria-labelledby="tab-overview"></section>
    <section class="view" id="view-top" role="tabpanel" aria-labelledby="tab-top"></section>
    <section class="view" id="view-recent" role="tabpanel" aria-labelledby="tab-recent"></section>
    <section class="view" id="view-library" role="tabpanel" aria-labelledby="tab-library"></section>
    <section class="view" id="view-history" role="tabpanel" aria-labelledby="tab-history"></section>
    <section class="view" id="view-setup" role="tabpanel" aria-labelledby="tab-setup"></section>
  </main>

  <footer class="foot">
    <p>
      Everything here runs in your browser. Your Spotify token, your play log and any
      imported history stay on this device — there is no server and nothing is uploaded.
      Not affiliated with Spotify AB.
    </p>
  </footer>

  <script src="js/util.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/api.js"></script>
  <script src="js/store.js"></script>
  <script src="js/unzip.js"></script>
  <script src="js/csv.js"></script>
  <script src="js/apple.js"></script>
  <script src="js/history.js"></script>
  <script src="js/charts.js"></script>
  <script src="js/app.js"></script>
  <script>
    /* Registered here rather than in app.js so a failed registration (http://,
       an old browser, a private window) can't take the page down with it. */
    if ("serviceWorker" in navigator) {
      addEventListener("load", function () {
        navigator.serviceWorker.register("sw.js").catch(function () { /* runs fine without it */ });
      });
    }
  </script>
</body>
</html>
