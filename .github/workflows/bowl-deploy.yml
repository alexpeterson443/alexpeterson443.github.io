# Deploys the bowling app to Cloudflare Pages whenever it changes on main, so
# a merged PR goes live without a laptop and a terminal.
#
# Uses the same CLOUDFLARE_API_TOKEN as the menu site. Its "Edit Cloudflare
# Workers" template includes Pages edit. Secrets (ACCESS_KEY and the rest) live
# on the Pages project and are untouched by a deploy.

name: Deploy bowling app

on:
  push:
    branches: [main]
    paths:
      - "bowling/**"
      - ".github/workflows/bowl-deploy.yml"
  workflow_dispatch:

concurrency:
  group: bowl-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: bowling
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Test
        run: npm test

      - name: Deploy to Cloudflare Pages
        if: env.CLOUDFLARE_API_TOKEN != ''
        run: npx --yes wrangler@4 pages deploy --project-name bowling-streak --branch main

      - name: Note missing Cloudflare token
        if: env.CLOUDFLARE_API_TOKEN == ''
        run: echo "::warning::CLOUDFLARE_API_TOKEN is not set, so the bowling app was tested but not deployed."
